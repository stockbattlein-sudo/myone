services:
  postgres:
    image: postgres:16-alpine
    container_name: stockbattle-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: stockbattle
      POSTGRES_PASSWORD: stockbattle_dev
      POSTGRES_DB: stockbattle
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockbattle -d stockbattle']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockbattle-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: stockbattle-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://stockbattle:stockbattle_dev@postgres:5432/stockbattle
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_32_characters_minimum_length
      JWT_REFRESH_SECRET: dev_refresh_secret_32_characters_minimum_length
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: http://localhost:3001
    container_name: stockbattle-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
